name: Go CI

on:
  push:
    branches: [ "main", "test", "v2_test" ]
  pull_request:
    branches: [ "main", "test", "v2_test" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.2'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
