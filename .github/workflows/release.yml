name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.2'
        cache: true

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        BINARY_NAME=schnorarr
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME=schnorarr.exe
        fi
        go build -v -o build/$BINARY_NAME ./cmd/monitor

    - name: Archive
      run: |
        cd build
        if [ "${{ matrix.goos }}" = "windows" ]; then
          zip schnorarr-${{ matrix.goos }}-${{ matrix.goarch }}.zip schnorarr.exe
        else
          tar -czvf schnorarr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz schnorarr
        fi

    - name: Upload Release Asset
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: build/schnorarr-${{ matrix.goos }}-${{ matrix.goarch }}.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
