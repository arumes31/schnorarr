name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary=schnorarr
          if [ "$GOOS" = "windows" ]; then binary=schnorarr.exe; fi
          go build -trimpath -buildvcs=true -o "build/$binary" ./cmd/monitor

      - name: Archive
        run: |
          cd build
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "schnorarr-${{ matrix.goos }}-${{ matrix.goarch }}.zip" schnorarr.exe
          else
            tar -czf "schnorarr-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" schnorarr
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: build/schnorarr-${{ matrix.goos }}-${{ matrix.goarch }}.*
