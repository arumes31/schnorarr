services:
  receiver:
    build: .
    environment:
      - MODE=receiver
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      # Leave ADMIN_PASS empty to get a temporary password in the startup log.
      - ADMIN_PASS=${ADMIN_PASS:-}
      - RSYNC_USER=${RSYNC_USER:-syncuser}
      - RSYNC_PASSWORD=${RSYNC_PASSWORD:?Set RSYNC_PASSWORD to a strong shared secret}
      # - TAILSCALE_AUTHKEY=tskey-auth-xxxx
      # - TS_HOSTNAME=schnorarr-receiver
      # - TAILSCALE_UP_ARGS=--accept-routes
    volumes:
      - ./receiver:/data
      - receiver_config:/config
      - receiver_state:/var/lib/tailscale
    # NET_ADMIN and /dev/net/tun are only needed when TAILSCALE_AUTHKEY is set.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

volumes:
  receiver_config:
  receiver_state:
