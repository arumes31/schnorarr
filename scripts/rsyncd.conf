log file = /dev/stdout
port = 873
use chroot = no
max connections = 10

[video-sync]
    path = /data
    pre-xfer exec = /scripts/check-storage.sh
    filter = - .schnorarr-shared-token - .schnorarr-share-id - .schnorarr-probe-*
    comment = Video Sync Destination
    read only = no
    list = yes
    hosts allow = *
    incoming chmod = D775,F664
    uid = root
    gid = root
    auth users = syncuser
    secrets file = /config/rsyncd.secrets
