log file = /dev/stdout
port = 873
use chroot = no
munge symlinks = yes
numeric ids = no
max connections = 10

[video-sync]
    path = /data
    comment = Video Sync Destination
    read only = no
    list = yes
    hosts allow = *
    incoming chmod = D775,F664
    uid = 65532
    gid = 65532
    auth users = syncuser
    secrets file = /tmp/rsyncd.secrets
